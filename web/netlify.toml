[build]
  command = "npm run build"
  publish = "dist"
  # Per-page social previews and the live sitemap. Both no-op safely when
  # API_URL is unset, so a deploy without it behaves exactly as before.
#  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
