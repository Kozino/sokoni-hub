[build]
  command = "npm run build"
  publish = "dist"
  # Per-page social previews and the live sitemap. Both no-op safely when
  # API_URL is unset, so a deploy without it behaves exactly as before.
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; form-action 'self'"
