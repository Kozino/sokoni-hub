name: Driver mobile build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: android
        type: choice
        options: [android, ios]
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, simulator, production]

permissions:
  contents: read

jobs:
  eas-build:
    name: EAS ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driver/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Link the Expo project if needed
        run: npx eas-cli@latest init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Submit cloud build
        run: npx eas-cli@latest build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
